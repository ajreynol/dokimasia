name: checks

on: [push, pull_request]

jobs:
  # Everything that needs no cvc5 checkout. Fast, and it is the majority.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read Koine pin
        id: koine
        run: echo "commit=$(cat scripts/koine.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ajreynol/koine
          ref: ${{ steps.koine.outputs.commit }}
          path: deps/koine
          persist-credentials: false
      - name: the test suite, without a cvc5 checkout
        run: |
          fail=0
          for t in tests/*.py; do
            echo "--- $t"
            python3 "$t" || fail=1
          done
          exit $fail
      - name: generated observation page matches its database
        run: scripts/append_findings --render-only --check

  # The ratchets, against the commit tools/cvc5.lock pins. This is the job that
  # would have caught a baseline naming an InferenceId cvc5 does not have, on
  # the commit that introduced it rather than a month later.
  ratchets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read Koine pin
        id: koine
        run: echo "commit=$(cat scripts/koine.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ajreynol/koine
          ref: ${{ steps.koine.outputs.commit }}
          path: deps/koine
          persist-credentials: false
      - name: fetch the pinned cvc5
        run: |
          commit=$(python3 -c "import json;print(json.load(open('tools/cvc5.lock'))['cvc5']['commit'])")
          repo=$(python3 -c "import json;print(json.load(open('tools/cvc5.lock'))['cvc5']['repo'])")
          echo "pinned at $commit"
          branch=$(python3 -c "import json;print(json.load(open('tools/cvc5.lock'))['cvc5']['branch'])")
          git init --quiet /tmp/cvc5
          git -C /tmp/cvc5 remote add origin "$repo"
          # GitHub refuses a bare-SHA fetch on most repos, so deepen the branch
          # until the pinned commit is present. A commit that is only on a fork
          # is never reached, which is exactly the failure we want here.
          git -C /tmp/cvc5 fetch --depth 1 origin "$commit" 2>/dev/null || true
          d=100
          until git -C /tmp/cvc5 cat-file -t "$commit" >/dev/null 2>&1; do
            if [ "$d" -gt 12800 ]; then
              echo "::error::$commit is not reachable on $repo $branch"
              exit 1
            fi
            git -C /tmp/cvc5 fetch --quiet --depth "$d" origin "$branch"
            d=$((d * 4))
          done
          git -C /tmp/cvc5 checkout --detach "$commit"
      - name: the pin is real, upstream, and what the docs quote
        run: python3 tests/test_pin.py /tmp/cvc5
      - name: every ratchet is clean at the pinned commit
        run: python3 -m dokimasia check /tmp/cvc5 --verbose
      - name: collect observations and replay through Koine
        run: |
          scripts/dokimasia_analyzer --cvc5 /tmp/cvc5 --dump /tmp/new-bugs.json --db /tmp/bugs.json --page /tmp/static-analysis.md
          cp /tmp/bugs.json /tmp/bugs-before.json
          scripts/append_findings /tmp/new-bugs.json --db /tmp/bugs.json --page /tmp/static-analysis.md
          cmp /tmp/bugs-before.json /tmp/bugs.json
          scripts/append_findings --render-only --check --db /tmp/bugs.json --page /tmp/static-analysis.md
      - name: the full suite, with the checkout
        run: |
          fail=0
          for t in tests/*.py; do
            echo "--- $t"
            python3 "$t" /tmp/cvc5 || fail=1
          done
          exit $fail
