name: policy

on: [push, pull_request]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kanon owns policy; Anoieu implements the checker. Validate the pinned code.
      - name: this repository still matches the Eunoia policy
        run: |
          commit=$(python3 -c "import json; print(json.load(open('scripts/deps.lock'))['anoieu']['commit'])")
          git clone --depth 1 https://github.com/ajreynol/anoieu /tmp/anoieu
          git -C /tmp/anoieu fetch --depth 1 origin "$commit"
          git -C /tmp/anoieu checkout --detach FETCH_HEAD
          python3 /tmp/anoieu/scripts/policy_check.py --root .
